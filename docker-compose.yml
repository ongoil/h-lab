services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: h-lab-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: h-lab-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    container_name: h-lab-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: hlab-test
      MARIADB_USER: hlabtest
      MARIADB_PASSWORD: hlab1234
      MARIADB_ROOT_PASSWORD: root1234
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data: